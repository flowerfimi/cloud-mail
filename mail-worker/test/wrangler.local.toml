# Only used by the local Workers Vitest pool. No production resources or build hook.
name = "cloud-mail-local-tests"
main = "../src/index.js"
# @cloudflare/vitest-pool-workers 0.7.8 bundles the 2025-03-10 runtime.
compatibility_date = "2025-03-10"

[[d1_databases]]
binding = "db"
database_name = "cloud-mail-test-only"
database_id = "00000000-0000-0000-0000-000000000002"

[[kv_namespaces]]
binding = "kv"
id = "00000000000000000000000000000002"

[vars]
domain = ["example.com"]
admin = "admin@example.com"
jwt_secret = "local-test-secret-not-a-production-credential"
orm_log = false
analysis_cache = false
ai_model = ""
